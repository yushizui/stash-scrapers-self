# yaml-language-server: $schema=../validator/scraper.schema.json
name: Trans World Asia
sceneByName:
  action: script
  script:
    - python
    - TransWorldAsia.py
    - scene-by-name
sceneByQueryFragment:
  action: script
  script:
    - python
    - TransWorldAsia.py
    - scene-by-query-fragment
sceneByURL:
  - action: scrapeXPath
    url:
      - asiantsworld.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@class="video-title"]
      Details:
        selector: '//div[@class="video-text"]/div[contains(@style, "color: white")]'
        postProcess:
          - replace:
              - regex: \s+
                with: " "
      Date:
        selector: //div[contains(@class, "video-info")]//p[contains(., "Added on:")]
        postProcess:
          - replace:
              - regex: \s+
                with: " "
          - replace:
              - regex: "Added on:"
                with: ""
          - replace:
              - regex: "^ "
                with: ""
          - parseDate: "Jan 2, 2006"
      Image:
        selector: //video/@poster
        postProcess:
          - replace:
              - regex: ^
                with: "https:"
      Studio:
        Name:
          fixed: Trans World Asia
      Tags:
        Name: //div[contains(@class, "model-tags")]//a
